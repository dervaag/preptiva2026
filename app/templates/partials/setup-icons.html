{% elif name == 'lock' %}<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/>
{% elif name == 'chevron' %}<path d="m6 9 6 6 6-6"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{% elif name == 'users' %}<circle cx="9" cy="7" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2m1-16a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 5v2"/>
