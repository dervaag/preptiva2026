{% from 'partials/setup-icons.html' import icon as common_icon %}
{% macro room_icon(name) -%}
{% if name in ('camera','mic','mirror','fullscreen','lock','chevron','users','arrow','check') %}{{ common_icon(name) }}{% else %}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'chat' %}<path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 3v-3H3V6a2 2 0 0 1 2-2Z"/><path d="M7 9h10M7 13h6"/>
{% elif name == 'captions' %}<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M10 10a3 3 0 1 0 0 4m9-4a3 3 0 1 0 0 4"/>
{% elif name == 'motion' %}<circle cx="12" cy="8" r="3"/><path d="M6 20v-1a6 6 0 0 1 12 0v1M3 5v5m-2-2 2 2 2-2m16 11v-5m-2 2 2-2 2 2"/>
{% elif name == 'close' %}<path d="m6 6 12 12M6 18 18 6"/>
{% elif name == 'computer' %}<rect x="4" y="3" width="16" height="13" rx="2"/><path d="M9 21h6m-3-5v5M8 12h8"/>
{% elif name == 'speaker' %}<path d="m11 4-6 5H2v6h3l6 5V4Zm4 4a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>
{% elif name == 'phone' %}<path d="M3 15a16 16 0 0 1 18 0v4h-5v-3a11 11 0 0 0-8 0v3H3v-4Z"/>
{% elif name == 'settings' %}<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="currentColor" stroke="none"/><circle cx="15" cy="17" r="3" fill="currentColor" stroke="none"/>
{% elif name == 'connection' %}<path d="M3 9a14 14 0 0 1 18 0M6 13a9 9 0 0 1 12 0m-9 4a4 4 0 0 1 6 0"/><circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/>
{% endif %}
</svg>
{% endif %}
{%- endmacro %}
